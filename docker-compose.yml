name: localsignal

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: localsignal
      POSTGRES_USER: localsignal
      POSTGRES_PASSWORD: localsignal
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./infra/db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U localsignal -d localsignal"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./services/api
    environment:
      DATABASE_URL: postgresql://localsignal:localsignal@db:5432/localsignal
      CORS_ORIGINS: http://localhost:3000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      SIGNAL_GENERATE_MIN_CANDIDATE_SCORE: ${SIGNAL_GENERATE_MIN_CANDIDATE_SCORE:-50}
      SIGNAL_GENERATE_MIN_EVIDENCE_COUNT: ${SIGNAL_GENERATE_MIN_EVIDENCE_COUNT:-2}
      SIGNAL_GENERATE_MIN_SOURCE_DIVERSITY: ${SIGNAL_GENERATE_MIN_SOURCE_DIVERSITY:-2}
      LLM_ENRICH_WEEKLY: ${LLM_ENRICH_WEEKLY:-true}
      LLM_ENRICH_MIN_EVIDENCE_COUNT: ${LLM_ENRICH_MIN_EVIDENCE_COUNT:-2}
      LLM_ENRICH_MIN_SOURCE_DIVERSITY: ${LLM_ENRICH_MIN_SOURCE_DIVERSITY:-1}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  engine:
    build:
      context: ./services/engine
    volumes:
      - ./data/social:/data/social:ro
    environment:
      DATABASE_URL: postgresql://localsignal:localsignal@db:5432/localsignal
      REDDIT_ENABLED: ${REDDIT_ENABLED:-false}
      REDDIT_SUBREDDITS: ${REDDIT_SUBREDDITS:-}
      REDDIT_MAX_QUERIES: ${REDDIT_MAX_QUERIES:-20}
      REDDIT_SLEEP_SECONDS: ${REDDIT_SLEEP_SECONDS:-2}
      REDDIT_INTERVAL_SECONDS: ${REDDIT_INTERVAL_SECONDS:-604800}
      RSS_FEED_URLS: ${RSS_FEED_URLS:-}
      GOOGLE_NEWS_ENABLED: ${GOOGLE_NEWS_ENABLED:-true}
      YELP_API_KEY: ${YELP_API_KEY:-}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      INSTAGRAM_JSON_PATH: ${INSTAGRAM_JSON_PATH:-}
      TIKTOK_JSON_PATH: ${TIKTOK_JSON_PATH:-}
      XHS_JSON_PATH: ${XHS_JSON_PATH:-}
      XIAOHONGSHU_JSON_PATH: ${XIAOHONGSHU_JSON_PATH:-}
      SOCIAL_JSON_DIR: ${SOCIAL_JSON_DIR:-/data/social/inbox}
      APIFY_TOKEN: ${APIFY_TOKEN:-}
      APIFY_SOCIAL_DATASET_IDS: ${APIFY_SOCIAL_DATASET_IDS:-}
      APIFY_SOCIAL_MAX_ITEMS: ${APIFY_SOCIAL_MAX_ITEMS:-200}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      LLM_ENRICH_WEEKLY: ${LLM_ENRICH_WEEKLY:-true}
      LLM_ENRICH_MIN_EVIDENCE_COUNT: ${LLM_ENRICH_MIN_EVIDENCE_COUNT:-2}
      LLM_ENRICH_MIN_SOURCE_DIVERSITY: ${LLM_ENRICH_MIN_SOURCE_DIVERSITY:-1}
      INGESTION_FALLBACK_TO_SAMPLE: ${INGESTION_FALLBACK_TO_SAMPLE:-false}
      ML_CURRENT_WINDOW_DAYS: ${ML_CURRENT_WINDOW_DAYS:-7}
      ML_BASELINE_WINDOW_DAYS: ${ML_BASELINE_WINDOW_DAYS:-28}
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - jobs

  scheduler:
    build:
      context: ./services/engine
    command: ["python", "-m", "localsignal_engine.scheduler"]
    volumes:
      - ./data/social:/data/social:ro
    environment:
      DATABASE_URL: postgresql://localsignal:localsignal@db:5432/localsignal
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-LocalSignal <digest@localsignal.local>}
      REDDIT_ENABLED: ${REDDIT_ENABLED:-false}
      REDDIT_SUBREDDITS: ${REDDIT_SUBREDDITS:-}
      REDDIT_MAX_QUERIES: ${REDDIT_MAX_QUERIES:-20}
      REDDIT_SLEEP_SECONDS: ${REDDIT_SLEEP_SECONDS:-2}
      REDDIT_INTERVAL_SECONDS: ${REDDIT_INTERVAL_SECONDS:-604800}
      RSS_FEED_URLS: ${RSS_FEED_URLS:-}
      GOOGLE_NEWS_ENABLED: ${GOOGLE_NEWS_ENABLED:-true}
      YELP_API_KEY: ${YELP_API_KEY:-}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      INSTAGRAM_JSON_PATH: ${INSTAGRAM_JSON_PATH:-}
      TIKTOK_JSON_PATH: ${TIKTOK_JSON_PATH:-}
      XHS_JSON_PATH: ${XHS_JSON_PATH:-}
      XIAOHONGSHU_JSON_PATH: ${XIAOHONGSHU_JSON_PATH:-}
      SOCIAL_JSON_DIR: ${SOCIAL_JSON_DIR:-/data/social/inbox}
      APIFY_TOKEN: ${APIFY_TOKEN:-}
      APIFY_SOCIAL_DATASET_IDS: ${APIFY_SOCIAL_DATASET_IDS:-}
      APIFY_SOCIAL_MAX_ITEMS: ${APIFY_SOCIAL_MAX_ITEMS:-200}
      INGESTION_FALLBACK_TO_SAMPLE: ${INGESTION_FALLBACK_TO_SAMPLE:-false}
      ML_CURRENT_WINDOW_DAYS: ${ML_CURRENT_WINDOW_DAYS:-7}
      ML_BASELINE_WINDOW_DAYS: ${ML_BASELINE_WINDOW_DAYS:-28}
      DAILY_EVIDENCE_ENABLED: ${DAILY_EVIDENCE_ENABLED:-true}
      DAILY_EVIDENCE_INTERVAL_SECONDS: ${DAILY_EVIDENCE_INTERVAL_SECONDS:-86400}
      WEEKLY_REPORT_ENABLED: ${WEEKLY_REPORT_ENABLED:-false}
      WEEKLY_INTERVAL_SECONDS: ${WEEKLY_INTERVAL_SECONDS:-604800}
      SCHEDULER_RUN_ON_START: ${SCHEDULER_RUN_ON_START:-true}
      SEND_DIGEST_ENABLED: ${SEND_DIGEST_ENABLED:-false}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      INTERNAL_API_BASE_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
